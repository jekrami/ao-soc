# Static dashboard + /api reverse proxy (E4, M15).
# Copyright (c) 2026 Ekrami-Labs. All rights reserved.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The dashboard is a single-page app: every path that is not a file is the
    # app's own route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://ui-api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # An analysis behind a cold model takes longer than the default 60s,
        # and a gateway timeout mid-approval is indistinguishable to an analyst
        # from a refused approval.
        proxy_read_timeout 180s;
    }

    # TLS terminates in front of this in production (M14 residual). The
    # container speaks plain HTTP on purpose: terminating TLS in three
    # different images means rotating certificates in three places.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
}
