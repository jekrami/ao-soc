<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 1010" width="1660" height="1010" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .t1 { font-size: 34px; font-weight: 700; fill: #0f172a; letter-spacing: 0.5px; }
    .t2 { font-size: 18px; fill: #334155; }
    .t3 { font-size: 14px; fill: #64748b; }
    .box-title { font-size: 17px; font-weight: 700; fill: #ffffff; }
    .side-title { font-size: 14px; font-weight: 700; fill: #ffffff; letter-spacing: 0.4px; }
    .box-sub { font-size: 13px; fill: #e2e8f0; }
    .ext-title { font-size: 15px; font-weight: 700; fill: #1e293b; letter-spacing: 0.6px; }
    .ext-item { font-size: 13.5px; fill: #334155; }
    .ext-note { font-size: 12.5px; fill: #64748b; }
    .chip { font-size: 12.5px; font-weight: 700; }
    .lbl { font-size: 12.5px; fill: #475569; paint-order: stroke; stroke: #f8fafc; stroke-width: 3px; stroke-linejoin: round; }
    .legend { font-size: 13.5px; fill: #334155; }
    .foot { font-size: 13px; fill: #64748b; }
  </style>

  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#334155"/>
    </marker>
    <marker id="arwd" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1660" height="1010" fill="#f8fafc"/>

  <!-- ================= Title ================= -->
  <text class="t1" x="830" y="52" text-anchor="middle">AI-SOC SOFTWARE ARCHITECTURE</text>
  <text class="t2" x="830" y="82" text-anchor="middle">AI-Powered Security Operations Center — the Decision Layer</text>
  <text class="t3" x="830" y="106" text-anchor="middle">Version 2.6 — Summer 2026</text>

  <!-- ================= External: detection sources (left) ================= -->
  <rect x="30" y="160" width="290" height="292" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="30" y="160" width="290" height="38" rx="10" fill="#e2e8f0"/>
  <text class="ext-title" x="175" y="185" text-anchor="middle">EXTERNAL TOOLS — DETECTION</text>

  <text class="ext-item" x="50" y="228">SIEM platforms</text>
  <text class="ext-note" x="50" y="248">Splunk · Elastic · Wazuh · Sentinel</text>
  <text class="ext-item" x="50" y="278">EDR / XDR products</text>
  <text class="ext-item" x="50" y="306">Network monitoring — NDR / IDS</text>
  <text class="ext-note" x="50" y="326">Suricata · Zeek</text>
  <text class="ext-item" x="50" y="356">Cloud &amp; identity security</text>
  <line x1="50" y1="374" x2="300" y2="374" stroke="#e2e8f0" stroke-width="1.5"/>
  <text class="ext-note" x="50" y="398">Log collection, retention and</text>
  <text class="ext-note" x="50" y="416">detection belong to these tools.</text>
  <text class="ext-note" x="50" y="434">Raw logs never enter AI-SOC.</text>

  <!-- External: threat intel feeds -->
  <rect x="30" y="472" width="290" height="150" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="30" y="472" width="290" height="34" rx="10" fill="#e2e8f0"/>
  <text class="ext-title" x="175" y="495" text-anchor="middle">THREAT INTELLIGENCE FEEDS</text>
  <text class="ext-note" x="50" y="532">MISP · OpenCTI · VirusTotal</text>
  <text class="ext-item" x="50" y="562">Queried by a client — built</text>
  <text class="ext-note" x="50" y="586">verifies what the model asserted;</text>
  <text class="ext-note" x="50" y="606">unverified never reads as verified</text>

  <!-- ================= External: execution (right) ================= -->
  <rect x="1330" y="160" width="290" height="292" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="1330" y="160" width="290" height="38" rx="10" fill="#e2e8f0"/>
  <text class="ext-title" x="1475" y="185" text-anchor="middle">EXTERNAL TOOLS — EXECUTION</text>

  <text class="ext-item" x="1350" y="228">SOAR platforms — driven by a connector</text>
  <text class="ext-note" x="1350" y="248">Shuffle · Cortex XSOAR · Tines</text>
  <text class="ext-item" x="1350" y="278">EDR response — isolate host</text>
  <text class="ext-item" x="1350" y="306">Firewall — block address</text>
  <text class="ext-item" x="1350" y="334">Identity (IdP) — revoke session</text>
  <line x1="1350" y1="356" x2="1600" y2="356" stroke="#e2e8f0" stroke-width="1.5"/>
  <text class="ext-note" x="1350" y="398">One connector per role; the action</text>
  <text class="ext-note" x="1350" y="416">class chooses it. Execution still</text>

  <!-- External: system of record -->
  <rect x="1330" y="472" width="290" height="150" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="1330" y="472" width="290" height="34" rx="10" fill="#e2e8f0"/>
  <text class="ext-title" x="1475" y="495" text-anchor="middle">SYSTEM OF RECORD</text>
  <text class="ext-note" x="1350" y="532">Jira · ServiceNow · TheHive</text>
  <text class="ext-item" x="1350" y="562">Bidirectional case sync — built</text>
  <text class="ext-note" x="1350" y="586">it owns the workflow, we own the</text>
  <text class="ext-note" x="1350" y="606">decision; inbound can never act.</text>

  <!-- ================= Boundary ================= -->
  <rect x="330" y="110" width="960" height="774" rx="14" fill="#ffffff" stroke="#1e3a8a" stroke-width="3"/>
  <rect x="330" y="110" width="960" height="42" rx="14" fill="#1e3a8a"/>
  <rect x="330" y="140" width="960" height="12" fill="#1e3a8a"/>
  <text class="box-title" x="810" y="139" text-anchor="middle">AI-SOC SYSTEM BOUNDARY — WHAT GETS BUILT</text>

  <!-- L1 intake -->
  <rect x="348" y="160" width="924" height="78" rx="9" fill="#0f766e"/>
  <circle cx="1248" cy="184" r="7" fill="#16a34a" stroke="#ffffff" stroke-width="1.5"/>
  <text class="box-title" x="810" y="189" text-anchor="middle">1. Detection Intake — one adapter per tool</text>
  <text class="box-sub" x="810" y="213" text-anchor="middle">“Detection Intake contract” (contract 1) · source tool · rule identity · entities · severity · raw payload preserved verbatim</text>
  <text class="box-sub" x="810" y="231" text-anchor="middle">Rule 9 satisfied — 7 adapters (Splunk · Wazuh · Elastic · Sentinel · CrowdStrike · CEF · native); a new tool is one file, not a code change</text>

  <!-- L2 correlation -->
  <rect x="560" y="260" width="712" height="90" rx="9" fill="#6d28d9"/>
  <circle cx="1248" cy="284" r="7" fill="#16a34a" stroke="#ffffff" stroke-width="1.5"/>
  <text class="box-title" x="916" y="289" text-anchor="middle">2. Cross-tool correlation engine → “Security Situation”</text>
  <text class="box-sub" x="916" y="313" text-anchor="middle">time window · shared entity (user · host · address · file hash · URL) · deterministic risk score, factors kept</text>
  <text class="box-sub" x="916" y="335" text-anchor="middle">Contract 2, the differentiator — nothing else joins detections across vendors; two that prove to be one are merged</text>

  <!-- L3 AI reasoning -->
  <rect x="560" y="372" width="712" height="116" rx="9" fill="#4338ca"/>
  <circle cx="1248" cy="396" r="7" fill="#16a34a" stroke="#ffffff" stroke-width="1.5"/>
  <text class="box-title" x="916" y="401" text-anchor="middle">3. AI Analysis &amp; Reasoning Engine</text>
  <rect x="574" y="416" width="330" height="56" rx="7" fill="#ffffff" fill-opacity="0.14" stroke="#c7d2fe" stroke-width="1"/>
  <text class="chip" x="739" y="437" text-anchor="middle" fill="#e0e7ff">Structured reasoning — built</text>
  <text class="box-sub" x="739" y="458" text-anchor="middle">evidence · rationale · ATT&amp;CK · JSON output</text>
  <rect x="928" y="416" width="330" height="56" rx="7" fill="#ffffff" fill-opacity="0.14" stroke="#c7d2fe" stroke-width="1"/>
  <text class="chip" x="1093" y="437" text-anchor="middle" fill="#e0e7ff">Verification &amp; precedent — built</text>
  <text class="box-sub" x="1093" y="458" text-anchor="middle">intel checked · ATT&amp;CK catalogue · cited precedent</text>

  <!-- L4 tier2 -->
  <rect x="560" y="510" width="712" height="82" rx="9" fill="#b91c1c"/>
  <circle cx="1248" cy="534" r="7" fill="#16a34a" stroke="#ffffff" stroke-width="1.5"/>
  <text class="box-title" x="916" y="539" text-anchor="middle">4. AI SOC Analyst (Tier 2)</text>
  <text class="box-sub" x="916" y="563" text-anchor="middle">Verdict: CONTAIN · ESCALATE · INVESTIGATE · MONITOR · IGNORE</text>
  <text class="box-sub" x="916" y="583" text-anchor="middle">confidence · rationale · risk of the action itself · bundled action plan</text>

  <!-- L5 human -->
  <rect x="560" y="614" width="712" height="76" rx="9" fill="#b45309"/>
  <circle cx="1248" cy="638" r="7" fill="#16a34a" stroke="#ffffff" stroke-width="1.5"/>
  <text class="box-title" x="916" y="643" text-anchor="middle">5. Human approval &amp; edit</text>
  <text class="box-sub" x="916" y="666" text-anchor="middle">Approve · Reject · Edit the verdict and the action plan — all built</text>
  <text class="box-sub" x="916" y="684" text-anchor="middle">every correction stored as a label — and autonomy is granted only where humans already confirmed the same verdict</text>

  <!-- L6 dispatch -->
  <rect x="560" y="712" width="712" height="76" rx="9" fill="#047857"/>
  <circle cx="1248" cy="736" r="7" fill="#16a34a" stroke="#ffffff" stroke-width="1.5"/>
  <text class="box-title" x="916" y="741" text-anchor="middle">6. Dispatch the decision to the executor that performs that class of action</text>
  <text class="box-sub" x="916" y="764" text-anchor="middle">Action risk class: READ · LOW_WRITE · HIGH_WRITE · DESTRUCTIVE</text>
  <text class="box-sub" x="916" y="782" text-anchor="middle">routed per class · idempotent · dry run until read · unverified delivery is never DONE</text>

  <!-- Side: decision store -->
  <rect x="348" y="260" width="196" height="228" rx="9" fill="#1e293b"/>
  <circle cx="372" cy="284" r="7" fill="#16a34a" stroke="#ffffff" stroke-width="1.5"/>
  <text class="side-title" x="446" y="289" text-anchor="middle">DECISION STORE</text>
  <text class="box-sub" x="446" y="318" text-anchor="middle">Security situations</text>
  <text class="box-sub" x="446" y="342" text-anchor="middle">Decisions &amp; rationale</text>
  <text class="box-sub" x="446" y="366" text-anchor="middle">Corrections + outcomes</text>
  <text class="box-sub" x="446" y="390" text-anchor="middle">Action receipts</text>
  <text class="box-sub" x="446" y="414" text-anchor="middle">Evidence pointers</text>
  <line x1="368" y1="432" x2="524" y2="432" stroke="#475569" stroke-width="1.5"/>
  <text class="box-sub" x="446" y="456" text-anchor="middle">Searchable · retention drops</text>
  <text class="box-sub" x="446" y="476" text-anchor="middle">vendor copies, never decisions</text>

  <!-- Side: dashboard -->
  <rect x="348" y="510" width="196" height="278" rx="9" fill="#1d4ed8"/>
  <circle cx="372" cy="534" r="7" fill="#16a34a" stroke="#ffffff" stroke-width="1.5"/>
  <text class="side-title" x="446" y="539" text-anchor="middle">DASHBOARD</text>
  <text class="box-sub" x="446" y="568" text-anchor="middle">7 operational routes</text>
  <text class="box-sub" x="446" y="592" text-anchor="middle">Bilingual EN / FA</text>
  <text class="box-sub" x="446" y="616" text-anchor="middle">Full RTL support</text>
  <text class="box-sub" x="446" y="640" text-anchor="middle">Executive KPIs</text>
  <text class="box-sub" x="446" y="664" text-anchor="middle">ATT&amp;CK heatmap</text>
  <text class="box-sub" x="446" y="688" text-anchor="middle">Tier-2 panel</text>
  <text class="box-sub" x="446" y="712" text-anchor="middle">Incident archive</text>
  <line x1="368" y1="730" x2="524" y2="730" stroke="#93c5fd" stroke-width="1.5"/>
  <text class="box-sub" x="446" y="754" text-anchor="middle">Outcomes attributed</text>
  <text class="box-sub" x="446" y="774" text-anchor="middle">per source tool</text>

  <!-- Governance -->
  <rect x="348" y="806" width="924" height="58" rx="9" fill="#334155"/>
  <circle cx="1248" cy="835" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
  <text class="box-title" x="810" y="830" text-anchor="middle">GOVERNANCE &amp; SECURITY — authentication · RBAC · secrets management · audit</text>
  <text class="box-sub" x="810" y="852" text-anchor="middle">Auth and roles on every route · metrics with latency histograms · start-up preflight · verified backups · containers; IdP/SSO and RBAC remain</text>

  <!-- ================= Arrows ================= -->
  <line x1="296" y1="199" x2="330" y2="199" stroke="#334155" stroke-width="2.5" marker-end="url(#arw)"/>
  <text class="lbl" x="313" y="182" text-anchor="middle">detections</text>

  <line x1="916" y1="238" x2="916" y2="254" stroke="#334155" stroke-width="2.5" marker-end="url(#arw)"/>
  <line x1="916" y1="350" x2="916" y2="366" stroke="#334155" stroke-width="2.5" marker-end="url(#arw)"/>
  <line x1="916" y1="488" x2="916" y2="504" stroke="#334155" stroke-width="2.5" marker-end="url(#arw)"/>
  <line x1="916" y1="592" x2="916" y2="608" stroke="#334155" stroke-width="2.5" marker-end="url(#arw)"/>
  <line x1="916" y1="690" x2="916" y2="706" stroke="#334155" stroke-width="2.5" marker-end="url(#arw)"/>

  <line x1="1290" y1="750" x2="1324" y2="750" stroke="#334155" stroke-width="2.5" marker-end="url(#arw)"/>
  <text class="lbl" x="1307" y="733" text-anchor="middle">commands</text>

  <path d="M330 542 L300 542" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arwd)"/>
  <text class="lbl" x="313" y="526" text-anchor="middle">query</text>

  <path d="M1290 542 L1324 542" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arwd)"/>
  <text class="lbl" x="1307" y="526" text-anchor="middle">case</text>

  <!-- store <-> reasoning (precedent) -->
  <path d="M544 374 L560 374" stroke="#c7d2fe" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arwd)"/>
  <path d="M560 300 L544 300" stroke="#c7d2fe" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arwd)"/>

  <!-- ================= Legend ================= -->
  <rect x="330" y="914" width="960" height="52" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="legend" x="352" y="946">Implementation status:</text>
  <circle cx="502" cy="941" r="7" fill="#16a34a"/>
  <text class="legend" x="516" y="946">Built</text>
  <circle cx="576" cy="941" r="7" fill="#f59e0b"/>
  <text class="legend" x="590" y="946">Partial</text>
  <circle cx="666" cy="941" r="7" fill="#dc2626"/>
  <text class="legend" x="680" y="946">Not built</text>
  <rect x="778" y="934" width="14" height="14" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3"/>
  <text class="legend" x="800" y="946">Out of scope — market tool</text>
  <text class="legend" x="1010" y="946">dashed line = external dependency</text>

  <!-- ================= Footer ================= -->
  <text class="foot" x="830" y="994" text-anchor="middle">Written by J.Ekrami · Co-written with Claude (Opus 5) · © J.Ekrami-Labs · Summer 2026 · matches plan v2.6</text>
</svg>
